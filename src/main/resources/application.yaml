spring:
  application:
    name: ShahbazTrades

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      accept-empty-string-as-null-object: true

  main:
    lazy-initialization: false

  threads:
    virtual:
      enabled: false

  jmx:
    enabled: false

  mongodb:
    uri: ${MONGO_URI}

  services:
    session-manager:
      url: ${SESSION_MANAGER_URI}

  cloud:
    openfeign:
      compression:
        request:
          enabled: true
        response:
          enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 15000
            logger-level: basic

server:
  address: 0.0.0.0
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.apache.coyote.http11.Http11Processor: WARN
    org.springframework.web.servlet.resource.ResourceHandlerUtils: ERROR
